<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot_Password</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="h../css/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/ems.css" rel="stylesheet">
</head>
<body class=”auth-page”>
    <div class=”auth-card fade-in”>
        <div class=”auth-header”>
            <I class=”bi bi-key”></i>
            <h2>Reset Password</h2>
            <p>Enter your email to receive reset instructions</p>
        </div>
        
        <div class=”auth-body”>
            <form id=”forgotForm” onsubmit="handleForgotPassword(event)">
                <div class=”auth-input-group”>
                    <I class=”bi bi-envelope”></i>
                    <input type=”email” class=”auth-input” id=”forgotEmail” placeholder=”Enter your email address” required>
                </div>
                
                <button type=”submit” class=”btn-auth”>
                    <I class=”bi bi-send me-2”></i>Send Reset Link
                </button>
            </form>
            
            <div class=”mt-4 p-3 rounded-3” style=”background:#eff6ff; border: 1px solid #dbeafe;”>
                <div class=”d-flex align-items-start gap-2”>
                    <I class=”bi bi-info-circle-fill text-primary mt-1”></i>
                    <div>
                        <h6 class=”mb-1” style=”font-size:0.9rem; color: var(--ems-dark);”>What happens next?</h6>
                        <p class=”mb-0” style=”font-size:0.85rem; color: var(--ems-secondary);”>
                            We’ll send a password reset link to your email. Click the link to create a new password. The link expires in 24 hours.
                        </p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class=”auth-footer”>
            <span style=”color:var(--ems-secondary);”> Remember your password?</span>
            <a href=”login.html”>Back to Login</a>
        </div>
    </div>

    <script src=../js/bootstrap.bundle.min.js></script>
    <script src=”../js/ems.js”></script>
    <script>
        Function handleForgotPassword€{
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            
            if (!isValidEmail(email)) {
                showToast(Please enter a valid email address!,'error');
                return;
            }
            
            showToast('Reset link sent! Check your email.','success');
            
            // Show success state
            Document.getElementById(‘forgotForm’).innerHTML = `
                <div class=”text-center py-4”>
                    <I class=”bi bi-envelope-check” style=”font-size: 3rem; color: var(--ems-success);”></i>
                    <h5 class=”mt-3” style=”color: var(--ems-dark);”>Check Your Email</h5>
                    <p class=”text-muted” style=”font-size: 0.9rem;”>
                        We’ve sent a password reset link to <strong>${email}</strong>.<br>
                        Please check your inbox and follow the instructions.
                    </p>
                    <button class=”btn btn-ems-primary mt-2” onclick=”window.location.href=’login.html’”>
                        <I class=”bi bi-box-arrow-in-right me-1”></i> Back to Login
                    </button>
                </div>
            `;
        }
    </script>
</body>
</html>
