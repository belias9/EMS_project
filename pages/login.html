<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EMS - Employment Management System</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ===== SPLIT SCREEN LAYOUT ===== */
        .login-wrapper {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* ===== LEFT SIDE - FORM ===== */
        .login-form-side {
            flex: 0 0 45%;
            max-width: 520px;
            min-width: 420px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
        }

        /* Logo */
        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .login-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
        }

        .login-logo-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
            letter-spacing: -0.02em;
        }

        /* Header */
        .login-header {
            margin-bottom: 1.75rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.35rem;
            letter-spacing: -0.02em;
        }

        .login-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
            font-weight: 400;
        }

        /* Tab Toggle */
        .login-tabs {
            display: flex;
            gap: 0.5rem;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }

        .login-tab {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-tab.active {
            background: white;
            color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 1rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            z-index: 2;
        }

        .login-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.75rem;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--text-dark);
            background: white;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .login-input::placeholder {
            color: #94a3b8;
        }

        .input-action {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .input-action:hover {
            color: var(--text-dark);
        }

        /* Options Row */
        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .remember-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .remember-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid var(--border);
            accent-color: var(--primary);
            cursor: pointer;
        }

        .remember-check label {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 400;
        }

        .forgot-link {
            font-size: 0.8rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Social Login */
        .social-login {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn-social {
            width: 100%;
            padding: 0.8rem;
            border: 1.5px solid var(--border);
            border-radius: 50px;
            background: white;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.3s ease;
            color: var(--text-dark);
        }

        .btn-social:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        .btn-social.apple {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }

        .btn-social.apple:hover {
            background: #334155;
            border-color: #334155;
        }

        .btn-social i {
            font-size: 1rem;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* ===== RIGHT SIDE - VISUAL ===== */
        .login-visual-side {
            flex: 1;
            position: relative;
            background: #0a0e1a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Gradient Background */
        .gradient-bg {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 60% at 20% 40%, rgba(37, 99, 235, 0.4) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 80% 60%, rgba(59, 130, 246, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(96, 165, 250, 0.15) 0%, transparent 70%),
                linear-gradient(135deg, #0a0e1a 0%, #0f172a 50%, #1e1b4b 100%);
        }

        /* Animated Waves */
        .wave-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(59, 130, 246, 0.08) 50%,
                transparent 70%
            );
            animation: wave-flow 15s ease-in-out infinite;
        }

        .wave:nth-child(2) {
            animation-delay: -5s;
            background: linear-gradient(
                -45deg,
                transparent 30%,
                rgba(37, 99, 235, 0.06) 50%,
                transparent 70%
            );
        }

        .wave:nth-child(3) {
            animation-delay: -10s;
            background: linear-gradient(
                90deg,
                transparent 40%,
                rgba(96, 165, 250, 0.05) 60%,
                transparent 80%
            );
        }

        @keyframes wave-flow {
            0%, 100% { transform: translate(-25%, -25%) rotate(0deg); }
            50% { transform: translate(-30%, -20%) rotate(5deg); }
        }

        /* Floating Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: orb-float 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(37, 99, 235, 0.3);
            top: 20%;
            left: 30%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(59, 130, 246, 0.2);
            bottom: 20%;
            right: 20%;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(96, 165, 250, 0.15);
            top: 50%;
            right: 40%;
            animation-delay: -14s;
        }

        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Glass Card on Visual Side */
        .visual-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            max-width: 320px;
            text-align: center;
            color: white;
        }

        .visual-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .visual-card p {
            font-size: 0.8rem;
            opacity: 0.6;
            line-height: 1.5;
            margin: 0;
        }

        /* ===== DEMO CREDENTIALS ===== */
        .demo-section {
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
        }

        .demo-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            text-align: center;
        }

        .demo-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .btn-demo {
            padding: 0.5rem;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: white;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }

        .btn-demo:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .btn-demo i {
            font-size: 0.8rem;
        }

        .demo-password {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .login-visual-side {
                display: none;
            }
            .login-form-side {
                flex: 1;
                max-width: 100%;
                min-width: auto;
            }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.75rem;
                border-radius: 20px;
            }
            .login-form-side {
                padding: 1rem;
                background: linear-gradient(135deg, #0a0e1a 0%, #1e1b4b 100%);
            }
            .login-card {
                background: rgba(255, 255, 255, 0.97);
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <!-- LEFT: Login Form -->
        <div class="login-form-side">
            <div class="login-card fade-in-up">
                <!-- Logo -->
                <div class="login-logo">
                    <div class="login-logo-icon">
                        <i class="bi bi-briefcase-fill"></i>
                    </div>
                    <span class="login-logo-text">EMS</span>
                </div>

                <!-- Header -->
                <div class="login-header">
                    <h2>Welcome Back Creative!</h2>
                    <p>We Are Happy To See You Again</p>
                </div>

                <!-- Tabs -->
                <div class="login-tabs">
                    <button class="login-tab active">Sign in</button>
                    <button class="login-tab" onclick="window.location.href='register.html'">Sign Up</button>
                </div>

                <!-- Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="bi bi-envelope input-icon"></i>
                            <input type="text" 
                                   class="login-input" 
                                   id="loginEmail"
                                   placeholder="Enter your email" 
                                   required>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" 
                                   class="login-input"
                                   id="loginPassword"
                                   placeholder="Enter your password"
                                    required>
                            <i class="bi bi-eye-slash input-action" onclick="togglePassword()"></i>
                        </div>
                    </div>

                    <div class="login-options">
                        <div class="remember-check">
                            <input type="checkbox" id="rememberMe">
                            <label for="rememberMe">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>

                <!-- Divider -->

                    <span class="divider-text">Or</span>
                    <div class="divider-line"></div>
                </div>

                <!-- Social Login -->
                <div class="social-login">
                    <button class="btn-social apple">
                        <i class="bi bi-apple"></i>
                        Log in with Apple
                    </button>
                    <button class="btn-social">
                        <svg width="16" height="16" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Log in with Google
                    </button>
                </div>

                <!-- Demo Credentials -->
                <div class="demo-section">
                    <div class="demo-title">Demo Credentials</div>
                    <div class="demo-buttons">
                        <button class="btn-demo" onclick="fillDemo('admin@ems.com')">
                            <i class="bi bi-shield-lock"></i>Admin
                        </button>
                        <button class="btn-demo" onclick="fillDemo('employer@ems.com')">
                            <i class="bi bi-building"></i>Employer
                        </button>
                        <button class="btn-demo" onclick="fillDemo('employee@ems.com')">
                            <i class="bi bi-person-workspace"></i>Employee
                        </button>

                            <i class="bi bi-person-badge"></i>Applicant

                    <div class="demo-password">Password for all: <strong>password</strong></div>

                <!-- Footer -->
                <div class="login-footer">
                    Don't have an account? <a href="register.html">Create Account</a>

        </div>

        <!-- RIGHT: Visual Side -->
        <div class="login-visual-side">
            <div class="gradient-bg"></div>
            <div class="wave-container">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>

            <div class="visual-card">
                <h3>Employment Management System</h3>
                <p>Connect. Hire. Grow. Your career journey starts here with our comprehensive platform.</p>
            </div>
        </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script>
        // ==========================================
        // AUTHENTICATION FUNCTIONS (Embedded)
        // ==========================================

        function isLoggedIn() {
            return localStorage.getItem('ems_user') !== null;
        }

        function getCurrentUser() {
            const user = localStorage.getItem('ems_user');
            return user ? JSON.parse(user) : null;
        }

        function getUserRole() {
            const user = getCurrentUser();
            return user ? user.role : null;
        }

        function loginUser(emailOrUsername, password) {
            const demoUsers = [
                { userID: 1, roleID: 1, role: 'Administrator', firstName: 'Admin', lastName: 'User', email: 'admin@ems.com', username: 'admin', profilePhoto: 'https://ui-avatars.com/api/?name=Admin+User&background=2563eb&color=fff' },
                { userID: 2, roleID: 2, role: 'Employer', firstName: 'John', lastName: 'Smith', email: 'employer@ems.com', username: 'employer', profilePhoto: 'https://ui-avatars.com/api/?name=John+Smith&background=10b981&color=fff' },
                { userID: 3, roleID: 3, role: 'Employee', firstName: 'Jane', lastName: 'Doe', email: 'employee@ems.com', username: 'employee', profilePhoto: 'https://ui-avatars.com/api/?name=Jane+Doe&background=f59e0b&color=fff' },
                { userID: 4, roleID: 4, role: 'Applicant', firstName: 'Mike', lastName: 'Johnson', email: 'applicant@ems.com', username: 'applicant', profilePhoto: 'https://ui-avatars.com/api/?name=Mike+Johnson&background=8b5cf6&color=fff' }
            ];

            const user = demoUsers.find(u =>
                (u.email === emailOrUsername || u.username === emailOrUsername) && password === 'password'
            );

            if (user) {
                localStorage.setItem('ems_user', JSON.stringify(user));
                return { success: true, user: user };
            }

            return { success: false, message: 'Invalid credentials. Try: admin@ems.com / password' };
        }

        function logoutUser() {
            localStorage.removeItem('ems_user');
            window.location.href = 'welcome.html';
        }

        /**
         * Redirect user to their role-specific dashboard
         */function redirectByRole() {
    const user = getCurrentUser();

    if (!user) {
        window.location.href = 'login.html';
        return;
    }

    switch(user.role) {
        case 'Administrator':
            window.location.href = 'admin-dashboard.html';
            break;

        case 'Employer':
            window.location.href = 'dashboard.html';
            break;

        case 'Employee':
            window.location.href = 'employee-dashboard.html';
            break;

        case 'Applicant':
            window.location.href = 'index.html';
            break;

        default:
            window.location.href = 'feed.html';
    }
}


        // ==========================================
        // TOAST NOTIFICATIONS
        // ==========================================

        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toastContainer') || createToastContainer();

            const icons = {
                success: 'bi-check-circle-fill',
                error: 'bi-x-circle-fill',
                info: 'bi-info-circle-fill',
                warning: 'bi-exclamation-triangle-fill'
            };

            const colors = {
                success: 'bg-success',
                error: 'bg-danger',
                info: 'bg-primary',
                warning: 'bg-warning'
            };

            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white ${colors[type]} border-0`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi ${icons[type]} me-2"></i>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;

            toastContainer.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { delay: 3000 });
            bsToast.show();

            toast.addEventListener('hidden.bs.toast', () => toast.remove());
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container position-fixed top-0 end-0 p-3';
            container.style.zIndex = '9999';
            document.body.appendChild(container);
            return container;
        }

        // ==========================================
        // UI FUNCTIONS
        // ==========================================

        function togglePassword() {
            const input = document.getElementById('loginPassword');
            const icon = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            }
        }

        function fillDemo(email) {
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = 'password';
        }

        function handleLogin(e){
            e.preventDefault();
            const email=document.getElementById('loginEmail').value;
            const password=document.getElementById('loginPassword').value;
            const result=loginUser(email,password);
            if (result.success){
                showToast('login successful! redirecting...','success');
                setTimeout(()=>{redirectByRole()},1200);
            }else{
                showToast(result.message,'error');
            }
        }
    </script>
</body>
</html>
