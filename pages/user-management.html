<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Management | EMS Admin</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/bootstrap-icons.css" rel="stylesheet">
    <link href="..//css/ems.css" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand"><i class="bi bi-briefcase-fill"></i><span>EMS Admin</span></div>
            <div class="sidebar-user">
                <img id="sidebarUserPhoto" src="https://ui-avatars.com/api/?name=Admin+User&background=2563eb&color=fff" alt="Profile">
                <div class="sidebar-user-info">
                    <h6 id="sidebarUserName">Admin User</h6>
                    <small id="sidebarUserRole">Administrator</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="sidebar-menu-title">Main</div>
                <a href="admin-dashboard.html" class="sidebar-item" data-page="dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
                <a href="user-management.html" class="sidebar-item" data-page="users"><i class="bi bi-people"></i><span>Users</span></a>
                <a href="role-management.html" class="sidebar-item active" data-page="roles"><i class="bi bi-shield-check"></i><span>Roles</span></a>
                <a href="permission-management.html" class="sidebar-item" data-page="permissions"><i class="bi bi-key"></i><span>Permissions</span></a>
                <div class="sidebar-menu-title">Management</div>
                <a href="company-approval.html" class="sidebar-item" data-page="companies"><i class="bi bi-building"></i><span>Companies</span></a>
                <a href="reports.html" class="sidebar-item" data-page="reports"><i class="bi bi-bar-chart-line"></i><span>Reports</span></a>
                <a href="announcements.html" class="sidebar-item" data-page="announcements"><i class="bi bi-megaphone"></i><span>Announcements</span></a>
                <a href="complaints.html" class="sidebar-item" data-page="complaints"><i class="bi bi-exclamation-circle"></i><span>Complaints</span></a>
                <div class="sidebar-menu-title">System</div>
                <a href="system-settings.html" class="sidebar-item" data-page="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
                <a href="#" class="sidebar-item logout" onclick="logoutUser(); return false;"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <h4>Role Management</h4>
                </div>
                <div class="header-actions">
                    <button class="header-btn" title="Notifications"><i class="bi bi-bell"></i><span class="badge bg-danger">3</span></button>
                </div>
            </header>

            <div class="admin-content">
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="dashboard-card text-center">
                            <div class="dashboard-card-icon icon-blue mx-auto"><i class="bi bi-shield-lock"></i></div>
                            <h3>4</h3>
                            <p>Total Roles</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="dashboard-card text-center">
                            <div class="dashboard-card-icon icon-green mx-auto"><i class="bi bi-check-circle"></i></div>
                            <h3>4</h3>
                            <p>Active Roles</p>
                        </div>
                    </div>
                </div>

                <div class="ems-table-card">
                    <div class="table-header">
                        <h5><i class="bi bi-shield-check me-2"></i>System Roles</h5>
                        <button class="btn btn-ems-primary" data-bs-toggle="modal" data-bs-target="#addRoleModal">
                            <i class="bi bi-plus-lg me-1"></i> Add Role
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table ems-table">
                            <thead>
                                <tr>
                                    <th>Role ID</th>
                                    <th>Role Name</th>
                                    <th>Description</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="rolesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade ems-modal" id="addRoleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-shield-plus me-2"></i>Add New Role</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="ems-form-label">Role Name</label>
                            <input type="text" class="ems-form-input" placeholder="e.g., Manager" required>
                        </div>
                        <div class="mb-3">
                            <label class="ems-form-label">Description</label>
                            <textarea class="ems-form-textarea" placeholder="Describe this role..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="ems-form-label">Status</label>
                            <select class="ems-form-select">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ems-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-ems-primary" onclick="showToast('Role added!', 'success'); bootstrap.Modal.getInstance(document.getElementById('addRoleModal')).hide();">Save Role</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/ems.js"></script>
    <script>
        function renderRoles() {
            document.getElementById('rolesTableBody').innerHTML = demoRoles.map(role => `
                <tr>
                    <td><strong>#${role.roleID}</strong></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="dashboard-card-icon ${role.roleName === 'Administrator' ? 'icon-red' : role.roleName === 'Employer' ? 'icon-green' : role.roleName === 'Employee' ? 'icon-orange' : 'icon-blue'}" style="width:36px;height:36px;font-size:1rem;margin:0;">
                                <i class="bi ${role.roleName === 'Administrator' ? 'bi-shield-lock' : role.roleName === 'Employer' ? 'bi-building' : role.roleName === 'Employee' ? 'bi-person-workspace' : 'bi-person-badge'}"></i>
                            </div>
                            <span style="font-weight:600;">${role.roleName}</span>
                        </div>
                    </td>
                    <td>${role.roleDescription}</td>
                    <td><span class="status-badge status-${role.status.toLowerCase()}">${role.status}</span></td>
                    <td>${formatDate(role.createdAt)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn-table-action btn-edit" title="Edit"><i class="bi bi-pencil"></i></button>
                            <button class="btn-table-action btn-delete" onclick="confirmAction('Delete this role?', () => showToast('Role deleted', 'success'))" title="Delete"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            renderRoles();
        });
    </script>
</body>
</html>
