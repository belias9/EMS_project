<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | EMS Admin</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/ems.css" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand"><i class="bi bi-briefcase-fill"></i><span>EMS Admin</span></div>
            <div class="sidebar-user">
                <img id="sidebarUserPhoto" src="https://ui-avatars.com/api/?name=Admin+User&background=2563eb&color=fff" alt="Profile">
                <div class="sidebar-user-info">
                    <h6 id="sidebarUserName">Admin User</h6>
                    <small id="sidebarUserRole">Administrator</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="sidebar-menu-title">Main</div>
                <a href="admin-dashboard.html" class="sidebar-item" data-page="dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
                <a href="user-management.html" class="sidebar-item" data-page="users"><i class="bi bi-people"></i><span>Users</span></a>
                <a href="role-management.html" class="sidebar-item" data-page="roles"><i class="bi bi-shield-check"></i><span>Roles</span></a>
                <a href="permission-management.html" class="sidebar-item" data-page="permissions"><i class="bi bi-key"></i><span>Permissions</span></a>
                <div class="sidebar-menu-title">Management</div>
                <a href="company-approval.html" class="sidebar-item" data-page="companies"><i class="bi bi-building"></i><span>Companies</span></a>
                <a href="reports.html" class="sidebar-item" data-page="reports"><i class="bi bi-bar-chart-line"></i><span>Reports</span></a>
                <a href="announcements.html" class="sidebar-item active" data-page="announcements"><i class="bi bi-megaphone"></i><span>Announcements</span></a>
                <a href="complaints.html" class="sidebar-item" data-page="complaints"><i class="bi bi-exclamation-circle"></i><span>Complaints</span></a>
                <div class="sidebar-menu-title">System</div>
                <a href="system-settings.html" class="sidebar-item" data-page="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
                <a href="#" class="sidebar-item logout" onclick="logoutUser(); return false;"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <h4>Announcements</h4>
                </div>
            </header>

            <div class="admin-content">
                <div class="row g-4">
                    <div class="col-lg-4">
                        <div class="ems-form-card">
                            <h5 class="mb-3"><i class="bi bi-megaphone me-2"></i>Create Announcement</h5>
                            <form id="announcementForm" onsubmit="postAnnouncement(event)">
                                <div class="mb-3">
                                    <label class="ems-form-label">Title</label>
                                    <input type="text" class="ems-form-input" id="annTitle" placeholder="Announcement title" required>
                                </div>
                                <div class="mb-3">
                                    <label class="ems-form-label">Message</label>
                                    <textarea class="ems-form-textarea" id="annMessage" placeholder="Write your announcement..." required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="ems-form-label">Target Audience</label>
                                    <select class="ems-form-select" id="annAudience">
                                        <option value="All">All Users</option>
                                        <option value="Applicants">Applicants</option>
                                        <option value="Employers">Employers</option>
                                        <option value="Employees">Employees</option>
                                        <option value="Admins">Admins</option>
                                    </select>
                                </div>
                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <label class="ems-form-label">Publish Date</label>
                                        <input type="datetime-local" class="ems-form-input" id="annPublishDate">
                                    </div>
                                    <div class="col-6">
                                        <label class="ems-form-label">Expiry Date</label>
                                        <input type="datetime-local" class="ems-form-input" id="annExpiryDate">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-ems-primary w-100">
                                    <i class="bi bi-send me-1"></i> Post Announcement
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="ems-table-card">
                            <div class="table-header">
                                <h5><i class="bi bi-list-check me-2"></i>All Announcements</h5>
                                <div class="btn-group btn-group-sm">
                                    <button class="btn btn-outline-secondary active">All</button>
                                    <button class="btn btn-outline-secondary">Published</button>
                                    <button class="btn btn-outline-secondary">Draft</button>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table ems-table">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Title</th>
                                            <th>Audience</th>
                                            <th>Status</th>
                                            <th>Publish Date</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="announcementsTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/ems-main.js"></script>
    <script>
        function renderAnnouncements() {
            document.getElementById('announcementsTableBody').innerHTML = demoAnnouncements.map(ann => `
                <tr>
                    <td><strong>#${ann.announcementID}</strong></td>
                    <td>
                        <div style="max-width: 250px;">
                            <strong style="font-size:0.9rem;">${ann.title}</strong>
                            <p class="text-muted mb-0" style="font-size:0.8rem;">${truncateText(ann.announcement, 60)}</p>
                        </div>
                    </td>
                    <td><span class="badge bg-info">${ann.targetAudience}</span></td>
                    <td><span class="status-badge status-${ann.announcementStatus.toLowerCase()}">${ann.announcementStatus}</span></td>
                    <td>${ann.publishDate ? formatDate(ann.publishDate) : 'Not scheduled'}</td>
                    <td>
                        <div class="table-actions">
                            <button class="btn-table-action btn-edit" title="Edit"><i class="bi bi-pencil"></i></button>
                            <button class="btn-table-action btn-delete" onclick="confirmAction('Delete this announcement?', () => showToast('Deleted', 'success'))" title="Delete"><i class="bi bi-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function postAnnouncement(e) {
            e.preventDefault();
            showToast('Announcement posted successfully!', 'success');
            document.getElementById('announcementForm').reset();
            renderAnnouncements();
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            renderAnnouncements();
        });
    </script>
</body>
</html>
