<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Approval | EMS Admin</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/ems.css" rel="stylesheet">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <div class="sidebar-brand"><i class="bi bi-briefcase-fill"></i><span>EMS Admin</span></div>
            <div class="sidebar-user">
                <img id="sidebarUserPhoto" src="https://ui-avatars.com/api/?name=Admin+User&background=2563eb&color=fff" alt="Profile">
                <div class="sidebar-user-info">
                    <h6 id="sidebarUserName">Admin User</h6>
                    <small id="sidebarUserRole">Administrator</small>
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="sidebar-menu-title">Main</div>
                <a href="admin-dashboard.html" class="sidebar-item" data-page="dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a>
                <a href="user-management.html" class="sidebar-item" data-page="users"><i class="bi bi-people"></i><span>Users</span></a>
                <a href="role-management.html" class="sidebar-item" data-page="roles"><i class="bi bi-shield-check"></i><span>Roles</span></a>
                <a href="permission-management.html" class="sidebar-item" data-page="permissions"><i class="bi bi-key"></i><span>Permissions</span></a>
                <div class="sidebar-menu-title">Management</div>
                <a href="company-approval.html" class="sidebar-item active" data-page="companies"><i class="bi bi-building"></i><span>Companies</span></a>
                <a href="reports.html" class="sidebar-item" data-page="reports"><i class="bi bi-bar-chart-line"></i><span>Reports</span></a>
                <a href="announcements.html" class="sidebar-item" data-page="announcements"><i class="bi bi-megaphone"></i><span>Announcements</span></a>
                <a href="complaints.html" class="sidebar-item" data-page="complaints"><i class="bi bi-exclamation-circle"></i><span>Complaints</span></a>
                <div class="sidebar-menu-title">System</div>
                <a href="system-settings.html" class="sidebar-item" data-page="settings"><i class="bi bi-gear"></i><span>Settings</span></a>
                <a href="#" class="sidebar-item logout" onclick="logoutUser(); return false;"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                    <h4>Company Approval</h4>
                </div>
            </header>

            <div class="admin-content">
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="dashboard-card text-center">
                            <div class="dashboard-card-icon icon-orange mx-auto"><i class="bi bi-hourglass-split"></i></div>
                            <h3>2</h3>
                            <p>Pending Approval</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="dashboard-card text-center">
                            <div class="dashboard-card-icon icon-green mx-auto"><i class="bi bi-check-circle"></i></div>
                            <h3>2</h3>
                            <p>Approved</p>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="dashboard-card text-center">
                            <div class="dashboard-card-icon icon-red mx-auto"><i class="bi bi-x-circle"></i></div>
                            <h3>1</h3>
                            <p>Rejected</p>
                        </div>
                    </div>
                </div>

                <div class="ems-table-card">
                    <div class="table-header">
                        <h5><i class="bi bi-building me-2"></i>Company Registrations</h5>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-outline-secondary active">All</button>
                            <button class="btn btn-sm btn-outline-warning">Pending</button>
                            <button class="btn btn-sm btn-outline-success">Approved</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table ems-table">
                            <thead>
                                <tr>
                                    <th>Reg ID</th>
                                    <th>Company</th>
                                    <th>Reg Number</th>
                                    <th>Submitted By</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="companyTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/ems.js"></script>
    <script>
        function renderCompanies() {
            document.getElementById('companyTableBody').innerHTML = demoCompanyRegistrations.map(reg => `
                <tr>
                    <td><strong>#${reg.registrationID}</strong></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(reg.companyName)}&background=random" class="rounded" width="36" height="36">
                            <span style="font-weight:600;">${reg.companyName}</span>
                        </div>
                    </td>
                    <td><code>${reg.registrationNumber}</code></td>
                    <td>User #${reg.submittedBy}</td>
                    <td>${formatDate(reg.registrationDate)}</td>
                    <td><span class="status-badge status-${reg.registrationStatus.toLowerCase()}">${reg.registrationStatus}</span></td>
                    <td>
                        <div class="table-actions">
                            ${reg.registrationStatus === 'Pending' ? `
                                <button class="btn-table-action btn-approve" onclick="approveCompany(${reg.registrationID})" title="Approve"><i class="bi bi-check-lg"></i></button>
                                <button class="btn-table-action btn-reject" onclick="rejectCompany(${reg.registrationID})" title="Reject"><i class="bi bi-x-lg"></i></button>
                            ` : `<button class="btn-table-action btn-view" title="View"><i class="bi bi-eye"></i></button>`}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function approveCompany(id) {
            confirmAction('Approve this company registration?', () => {
                showToast('Company approved successfully', 'success');
                renderCompanies();
            });
        }

        function rejectCompany(id) {
            confirmAction('Reject this company registration?', () => {
                showToast('Company registration rejected', 'warning');
                renderCompanies();
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAdminAccess();
            renderCompanies();
        });
    </script>
</body>
</html>
